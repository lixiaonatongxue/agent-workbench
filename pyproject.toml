[project]
name = "agent-workbench"
version = "0.1.0"
description = "Local workbench for your coding agents: rules health-check (Rules Doctor) + session archive (Session Explorer). 100% local, no telemetry."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "wangwujie253" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
